openapi: 3.0.3
info:
  title: gbrain API
  description: >-
    gbrain 知识库全生命周期管理 API(经 docker exec 执行容器内 CLI)。覆盖页面
    CRUD、标签/时间线/链接、搜索与代码索引、内容摄取、来源与作业管理、维护与记忆操作。


    约定:标记 [DESTRUCTIVE] 的操作会修改或删除数据;标记 [WRITE] 的操作会写入数据。调用方负责鉴权。

    SSE 输出:stdout/stderr 事件 + 末尾 exit 事件(exitCode/reason/durationMs)。
  version: 1.0.0
x-cli:
  binary: /usr/local/bin/gbrain
  argv: []
  maxConcurrency: 1
  timeoutMs: 60000
paths:
  /get/{slug}:
    get:
      x-cli:
        argv:
          - get
      summary: 读取页面
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug,支持模糊匹配
          schema:
            type: string
        - name: fuzzy
          in: query
          required: false
          description: 启用模糊 slug 解析
          schema:
            type: boolean
        - name: include-content
          in: query
          required: false
          description: 包含规范化 content 字段(frontmatter + body + timeline)
          schema:
            type: boolean
        - name: include-deleted
          in: query
          required: false
          description: 显示软删除页面(deleted_at 已填充)
          schema:
            type: boolean
        - name: source-id
          in: query
          required: false
          description: 限定单一来源;'__all__' 跨全部来源
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /put/{slug}:
    put:
      x-cli:
        argv:
          - put
        body:
          as: flag
          flag: content
      summary: 写入/替换页面
      description: >-
        整体替换页面(markdown + frontmatter)。非增量编辑;改前先用 get 读取规范内容。body 经 --content
        传入,Content-Type 用 text/markdown。


        请求体:完整 markdown 内容(含 YAML frontmatter)
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
        - name: allow-empty
          in: query
          required: false
          description: 允许用空/纯空白内容覆盖现有页面
          schema:
            type: boolean
        - name: source-kind
          in: query
          required: false
          description: 摄取渠道分类(capture-cli | put_page | webhook …)
          schema:
            type: string
        - name: source-uri
          in: query
          required: false
          description: 原始 URI/路径/消息 id
          schema:
            type: string
        - name: ingested-via
          in: query
          required: false
          description: 与 source-kind 配对的更细标签
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /delete/{slug}:
    delete:
      x-cli:
        argv:
          - delete
      summary: 软删除页面
      description: "[DESTRUCTIVE] 软删除:从搜索与 get/list 隐藏,72h 内可恢复;autopilot 回收期后硬删除。"
      parameters:
        - name: slug
          in: path
          required: true
          description: 要软删除的页面 slug
          schema:
            type: string
        - name: source-id
          in: query
          required: false
          description: 来源限定
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /list:
    get:
      x-cli:
        argv:
          - list
      summary: 列出页面
      parameters:
        - name: type
          in: query
          required: false
          description: 按页面类型过滤
          schema:
            type: string
        - name: tag
          in: query
          required: false
          description: 按标签过滤
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          required: false
          description: 分页偏移
          schema:
            type: integer
        - name: sort
          in: query
          required: false
          description: 排序方式
          schema:
            type: string
            default: updated_desc
            enum:
              - updated_desc
              - updated_asc
              - created_desc
              - slug
        - name: include-deleted
          in: query
          required: false
          description: 包含软删除页面
          schema:
            type: boolean
        - name: source-id
          in: query
          required: false
          description: 限定来源;'__all__' 跨全部来源
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /tags/{slug}:
    get:
      x-cli:
        argv:
          - tags
      summary: 列出页面标签
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /tag/{slug}/{tag}:
    put:
      x-cli:
        argv:
          - tag
      summary: 给页面添加标签
      description: "[WRITE] 添加标签(纯字符串,非 slug)。"
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
        - name: tag
          in: path
          required: true
          description: 要添加的标签
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /untag/{slug}/{tag}:
    delete:
      x-cli:
        argv:
          - untag
      summary: 移除页面标签
      description: "[WRITE] 移除标签(需与现有标签完全匹配)。"
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
        - name: tag
          in: path
          required: true
          description: 要移除的标签
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /timeline/{slug}:
    get:
      x-cli:
        argv:
          - timeline
      summary: 读取页面时间线
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
        - name: after
          in: query
          required: false
          description: 仅返回该日期(含)之后条目
          schema:
            type: string
        - name: before
          in: query
          required: false
          description: 仅返回该日期(含)之前条目
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大条目数
          schema:
            type: integer
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /timeline-add/{slug}/{date}/{summary}:
    post:
      x-cli:
        argv:
          - timeline-add
      summary: 添加时间线条目
      description: "[WRITE] 向结构化时间线存储追加条目(不修改 get 返回的 pages.timeline markdown)。"
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
        - name: date
          in: path
          required: true
          description: 条目日期,严格 YYYY-MM-DD
          schema:
            type: string
        - name: summary
          in: path
          required: true
          description: 单行摘要
          schema:
            type: string
        - name: detail
          in: query
          required: false
          description: 摘要后的长文本细节
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: 条目的出处引用(会议 slug 或 URL)
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /link-sources:
    get:
      x-cli:
        argv:
          - link-sources
      summary: 列出链接出处(provenance)及其边数
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /link/{from}/{to}:
    put:
      x-cli:
        argv:
          - link
      summary: 创建页面链接
      description: "[WRITE] 创建从 from 到 to 的有向链接。"
      parameters:
        - name: from
          in: path
          required: true
          description: 链接源页面 slug
          schema:
            type: string
        - name: to
          in: path
          required: true
          description: 链接目标页面 slug
          schema:
            type: string
        - name: link-type
          in: query
          required: false
          description: 链接类型(如 invested_in, works_at)
          schema:
            type: string
        - name: context
          in: query
          required: false
          description: 链接上下文
          schema:
            type: string
        - name: link-source
          in: query
          required: false
          description: 出处标签(kebab-case,默认 'manual';内置 reconciliation 类型被拒)
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /unlink/{from}/{to}:
    delete:
      x-cli:
        argv:
          - unlink
      summary: 移除页面链接
      description: "[DESTRUCTIVE] 移除从 from 到 to 的链接,可按类型/出处过滤。"
      parameters:
        - name: from
          in: path
          required: true
          description: 链接源页面 slug
          schema:
            type: string
        - name: to
          in: path
          required: true
          description: 链接目标页面 slug
          schema:
            type: string
        - name: link-type
          in: query
          required: false
          description: 仅移除该类型的边(省略 = 全部类型)
          schema:
            type: string
        - name: link-source
          in: query
          required: false
          description: 仅移除该出处的边(省略 = 任意出处)
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /backlinks/{slug}:
    get:
      x-cli:
        argv:
          - backlinks
      summary: 列出指向页面的入链
      parameters:
        - name: slug
          in: path
          required: true
          description: 页面 slug
          schema:
            type: string
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /search/{query}:
    get:
      x-cli:
        argv:
          - search
      summary: 关键词混合搜索
      description: 廉价 hybrid 搜索(向量 + 关键词 + RRF),无 LLM 扩展。精确 token/名称/结构化字段最佳。
      parameters:
        - name: query
          in: path
          required: true
          description: 搜索文本
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          required: false
          description: 跳过前 N 条
          schema:
            type: integer
        - name: mode
          in: query
          required: false
          description: 搜索模式
          schema:
            type: string
            enum:
              - conservative
              - balanced
              - tokenmax
        - name: source-id
          in: query
          required: false
          description: 限定来源;'__all__' 跨全部来源
          schema:
            type: string
        - name: types
          in: query
          required: false
          description: 按页面类型过滤,逗号分隔(如 person,company)
          schema:
            type: string
        - name: snippet-chars
          in: query
          required: false
          description: 每条结果 chunk_text 截断字符数;0 为全文
          schema:
            type: integer
        - name: salience
          in: query
          required: false
          description: 显著度加权(情感权重 + take 数)
          schema:
            type: string
            enum:
              - off
              - on
              - strong
        - name: recency
          in: query
          required: false
          description: 时效加权
          schema:
            type: string
            enum:
              - off
              - on
              - strong
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /query/{query}:
    get:
      x-cli:
        argv:
          - query
      summary: 混合搜索(含多查询扩展)
      description: 向量 + 关键词 + 多查询扩展。概念/同义/场景类问题优先用 query。
      parameters:
        - name: query
          in: path
          required: true
          description: 问题或主题文本
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数;省略或 0 按搜索模式默认
          schema:
            type: integer
        - name: offset
          in: query
          required: false
          description: 跳过前 N 条
          schema:
            type: integer
        - name: types
          in: query
          required: false
          description: 按页面类型过滤,逗号分隔
          schema:
            type: string
        - name: snippet-chars
          in: query
          required: false
          description: 每条结果 chunk_text 截断字符数;0 为全文
          schema:
            type: integer
        - name: expand
          in: query
          required: false
          description: 启用多查询扩展
          schema:
            type: boolean
            default: true
        - name: detail
          in: query
          required: false
          description: 结果详细度
          schema:
            type: string
            default: medium
            enum:
              - low
              - medium
              - high
        - name: mode
          in: query
          required: false
          description: 搜索模式
          schema:
            type: string
            enum:
              - conservative
              - balanced
              - tokenmax
        - name: lang
          in: query
          required: false
          description: 按 chunk 语言过滤(如 typescript, python)
          schema:
            type: string
        - name: symbol-kind
          in: query
          required: false
          description: 按符号类型过滤(function, class, method …)
          schema:
            type: string
        - name: near-symbol
          in: query
          required: false
          description: 以限定符号名锚定检索(如 BrainEngine.searchKeyword)
          schema:
            type: string
        - name: walk-depth
          in: query
          required: false
          description: 结构遍历深度 1-2,默认 0(关)
          schema:
            type: integer
        - name: salience
          in: query
          required: false
          description: 显著度加权
          schema:
            type: string
            enum:
              - off
              - on
              - strong
        - name: recency
          in: query
          required: false
          description: 时效加权
          schema:
            type: string
            enum:
              - off
              - on
              - strong
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /code-def/{symbol}:
    get:
      x-cli:
        argv:
          - code-def
      summary: 查找符号定义
      parameters:
        - name: symbol
          in: path
          required: true
          description: 符号名
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: 语言过滤
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /code-refs/{symbol}:
    get:
      x-cli:
        argv:
          - code-refs
      summary: 查找符号引用
      parameters:
        - name: symbol
          in: path
          required: true
          description: 符号名
          schema:
            type: string
        - name: lang
          in: query
          required: false
          description: 语言过滤
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /code-callers/{symbol}:
    get:
      x-cli:
        argv:
          - code-callers
      summary: 谁调用了该符号
      parameters:
        - name: symbol
          in: path
          required: true
          description: 符号名
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
        - name: all-sources
          in: query
          required: false
          description: 跨全部来源
          schema:
            type: boolean
        - name: source
          in: query
          required: false
          description: 限定来源
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /code-callees/{symbol}:
    get:
      x-cli:
        argv:
          - code-callees
      summary: 该符号调用了什么
      parameters:
        - name: symbol
          in: path
          required: true
          description: 符号名
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
        - name: all-sources
          in: query
          required: false
          description: 跨全部来源
          schema:
            type: boolean
        - name: source
          in: query
          required: false
          description: 限定来源
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /graph-query/{slug}:
    get:
      x-cli:
        argv:
          - graph-query
      summary: 图关系遍历
      parameters:
        - name: slug
          in: path
          required: true
          description: 起始页面 slug
          schema:
            type: string
        - name: type
          in: query
          required: false
          description: 仅返回该链接类型的边
          schema:
            type: string
        - name: depth
          in: query
          required: false
          description: 遍历深度
          schema:
            type: integer
            default: 5
        - name: direction
          in: query
          required: false
          description: 遍历方向
          schema:
            type: string
            default: out
            enum:
              - in
              - out
              - both
        - name: include-foreign
          in: query
          required: false
          description: 包含跨来源边
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /salience:
    get:
      x-cli:
        argv:
          - salience
      summary: 高显著度页面
      parameters:
        - name: days
          in: query
          required: false
          description: 时间窗口天数
          schema:
            type: integer
        - name: kind
          in: query
          required: false
          description: 结果种类过滤
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 最大结果数
          schema:
            type: integer
        - name: slug-prefix
          in: query
          required: false
          description: slug 前缀过滤
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /anomalies:
    get:
      x-cli:
        argv:
          - anomalies
      summary: 近期活动统计异常
      parameters:
        - name: lookback-days
          in: query
          required: false
          description: 回看天数
          schema:
            type: integer
        - name: sigma
          in: query
          required: false
          description: 异常阈值(标准差)
          schema:
            type: number
        - name: since
          in: query
          required: false
          description: 起始日期(YYYY-MM-DD)
          schema:
            type: string
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /orphans:
    get:
      x-cli:
        argv:
          - orphans
      summary: 孤立页面(无入链且无出链)
      parameters:
        - name: mode
          in: query
          required: false
          description: 孤立判定模式
          schema:
            type: string
        - name: source
          in: query
          required: false
          description: 限定来源
          schema:
            type: string
        - name: count
          in: query
          required: false
          description: 仅输出计数
          schema:
            type: boolean
        - name: include-pseudo
          in: query
          required: false
          description: 包含伪孤立
          schema:
            type: boolean
        - name: json
          in: query
          required: false
          description: JSON 输出
          schema:
            type: boolean
      responses:
        "200":
          description: SSE 流:stdout/stderr 事件 + 末尾 exit 事件
  /capture:
    post:
