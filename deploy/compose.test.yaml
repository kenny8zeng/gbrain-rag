# 隔离测试实例（anydoc 模式）——docs/testing-strategy §3 首次落地
# 用法：
#   docker compose -p gbrain-rag-test -f deploy/compose.test.yaml up -d --build
#   TEST_BASE_URL=http://localhost:3101 ADMIN_TOKEN=<test> bun test tests/integration/us5-anydoc.test.ts
#   docker compose -p gbrain-rag-test down -v   # 连卷销毁
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain
      POSTGRES_DB: gbrain_test
    volumes:
      - pgtest:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  gbrain-rag-test:
    # 测试实例：以 root 运行（隔离卷属主简化；测试环境无加固需求）
    user: root
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: 3000
      ADMIN_TOKEN: local-dev-token-0123456789
      DATABASE_URL: postgres://gbrain:gbrain@postgres:5432/gbrain_test
      DOCLING_URL: ""
      PARSER_MODE: anydoc
      DATA_DIR: /data/rag-test
      GBRAIN_SERVE_PORT: 7334
      MAX_UPLOAD_BYTES: "1048576"
    volumes:
      - ragtest:/data/rag-test
    ports:
      - "3101:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3102：docling 可用 + anydoc 优先（PARSER_PREFERENCE=anydoc）
  gbrain-rag-pref-anydoc:
    user: root
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: 3000
      ADMIN_TOKEN: local-dev-token-0123456789
      DATABASE_URL: postgres://gbrain:gbrain@postgres:5432/gbrain_test
      DOCLING_URL: https://docling.ml.aesiot.dev
      PARSER_PREFERENCE: anydoc
      DATA_DIR: /data/rag-pref
      GBRAIN_SERVE_PORT: 7335
      MAX_UPLOAD_BYTES: "1048576"
    volumes:
      - ragpref:/data/rag-pref
    ports:
      - "3102:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # 3103：docling 指向不可达 + docling 优先（回退触发场景）
  gbrain-rag-fallback:
    user: root
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: 3000
      ADMIN_TOKEN: local-dev-token-0123456789
      DATABASE_URL: postgres://gbrain:gbrain@postgres:5432/gbrain_test
      DOCLING_URL: http://127.0.0.1:1
      PARSER_PREFERENCE: docling
      DATA_DIR: /data/rag-fb
      GBRAIN_SERVE_PORT: 7336
      MAX_UPLOAD_BYTES: "1048576"
    volumes:
      - ragfb:/data/rag-fb
    ports:
      - "3103:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgtest:
  ragtest:
  ragpref:
  ragfb:
